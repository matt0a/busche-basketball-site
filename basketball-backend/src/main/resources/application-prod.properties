# =========================
# Server
# =========================
server.port=${PORT:8080}

# =========================
# Datasource (Postgres via Render)
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

# =========================
# JWT Configuration
# =========================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-millis=86400000

# =========================
# CORS Configuration
# =========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://buscheacademy.org,https://www.buscheacademy.org}

# =========================
# AWS S3
# =========================
app.s3.bucket-name=${APP_S3_BUCKET_NAME}
app.s3.region=${APP_S3_REGION}
app.s3.public-base-url=${APP_S3_PUBLIC_BASE_URL}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# =========================
# Multipart uploads
# =========================
# Spring Boot defaults to 1MB, which is smaller than a typical dining menu graphic.
# Must be set here too: application.properties is gitignored and is not present in
# the deployed build, so the prod profile is the only source of this setting.
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}
